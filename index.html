<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronicle | Market Analytics & Overview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            chronicleDark: '#0b0f19',
            chronicleCard: '#151c2c',
            chronicleBorder: '#232d42',
            chronicleAccent: '#6366f1',
            chronicleAccentHover: '#4f46e5'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-chronicleDark text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- TOP TICKER BAR -->
  <div class="bg-[#070a10] border-b border-chronicleBorder text-xs py-2.5 px-4 overflow-x-auto">
    <div class="max-w-7xl mx-auto flex justify-between items-center gap-6">
      <div class="flex items-center gap-6" id="tickerContainer">
        <span class="text-slate-400">Loading live market data...</span>
      </div>
      <div class="text-slate-400 text-[11px]">
        <span>Data Source: Public API Feed</span>
      </div>
    </div>
  </div>

  <!-- HEADER NAVIGATION -->
  <header class="bg-chronicleCard/90 backdrop-blur-md border-b border-chronicleBorder sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="bg-chronicleAccent p-2 rounded-xl text-white font-black text-xl">
          <i class="fa-solid fa-book-bookmark"></i>
        </div>
        <span class="font-black text-xl tracking-tight text-white">Chronicle <span class="text-chronicleAccent text-xs font-mono px-2 py-0.5 rounded bg-chronicleAccent/10 border border-chronicleAccent/30">ANALYTICS</span></span>
      </div>
      <div>
        <span class="text-xs font-semibold text-slate-400 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-chronicleBorder">
          Read-Only Mode
        </span>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT AREA -->
  <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">

    <!-- METRICS OVERVIEW -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-chronicleCard border border-chronicleBorder p-5 rounded-2xl">
        <span class="text-xs text-slate-400 font-bold uppercase tracking-wider block mb-1">Bitcoin (BTC)</span>
        <h3 id="btcPrice" class="text-2xl font-black font-mono text-white">Loading...</h3>
        <span id="btcChange" class="text-xs font-bold mt-1 inline-block">--</span>
      </div>

      <div class="bg-chronicleCard border border-chronicleBorder p-5 rounded-2xl">
        <span class="text-xs text-slate-400 font-bold uppercase tracking-wider block mb-1">Ethereum (ETH)</span>
        <h3 id="ethPrice" class="text-2xl font-black font-mono text-white">Loading...</h3>
        <span id="ethChange" class="text-xs font-bold mt-1 inline-block">--</span>
      </div>

      <div class="bg-chronicleCard border border-chronicleBorder p-5 rounded-2xl">
        <span class="text-xs text-slate-400 font-bold uppercase tracking-wider block mb-1">Solana (SOL)</span>
        <h3 id="solPrice" class="text-2xl font-black font-mono text-white">Loading...</h3>
        <span id="solChange" class="text-xs font-bold mt-1 inline-block">--</span>
      </div>
    </div>

    <!-- MARKET CHART SECTION -->
    <div class="bg-chronicleCard border border-chronicleBorder p-6 rounded-2xl space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-white text-base flex items-center gap-2">
          <i class="fa-solid fa-chart-line text-chronicleAccent"></i> Market Trend Demonstration
        </h2>
        <span class="text-xs text-slate-400">Sample Index Data</span>
      </div>
      <div class="h-64 sm:h-80 w-full">
        <canvas id="chronicleChart"></canvas>
      </div>
    </div>

  </main>

  <script>
    // Fetch live price updates from a public, unauthenticated API
    async function fetchLivePrices() {
      try {
        const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd&include_24hr_change=true');
        const data = await res.json();

        updateMetric('btcPrice', 'btcChange', data.bitcoin.usd, data.bitcoin.usd_24h_change);
        updateMetric('ethPrice', 'ethChange', data.ethereum.usd, data.ethereum.usd_24h_change);
        updateMetric('solPrice', 'solChange', data.solana.usd, data.solana.usd_24h_change);

        document.getElementById('tickerContainer').innerHTML = `
          <div class="flex items-center gap-6 text-xs">
            <span><strong>BTC:</strong> $${data.bitcoin.usd.toLocaleString()}</span>
            <span><strong>ETH:</strong> $${data.ethereum.usd.toLocaleString()}</span>
            <span><strong>SOL:</strong> $${data.solana.usd.toLocaleString()}</span>
          </div>
        `;
      } catch (err) {
        console.error('Failed to fetch live prices:', err);
      }
    }

    function updateMetric(priceId, changeId, price, change) {
      document.getElementById(priceId).innerText = `$${price.toLocaleString()}`;
      const changeEl = document.getElementById(changeId);
      const formattedChange = change.toFixed(2);

      if (change >= 0) {
        changeEl.innerText = `+${formattedChange}% (24h)`;
        changeEl.className = 'text-xs font-bold mt-1 inline-block text-emerald-400';
      } else {
        changeEl.innerText = `${formattedChange}% (24h)`;
        changeEl.className = 'text-xs font-bold mt-1 inline-block text-rose-400';
      }
    }

    function initChart() {
      const ctx = document.getElementById('chronicleChart');
      if (!ctx) return;
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: ['00:00', '04:00', '08:00', '12:00', '16:00', '20:00', '24:00'],
          datasets: [{
            label: 'Market Index Trend',
            data: [100, 104, 102, 108, 106, 112, 115],
            borderColor: '#6366f1',
            backgroundColor: 'rgba(99, 102, 241, 0.1)',
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
            y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } }
          }
        }
      });
    }

    window.addEventListener('load', () => {
      initChart();
      fetchLivePrices();
      setInterval(fetchLivePrices, 30000); // Refresh every 30 seconds
    });
  </script>
</body>
</html>
